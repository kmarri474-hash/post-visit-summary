<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- shield body -->
  <path d="M16 2 L4 7 V15 C4 22.5 9 28.5 16 30 C23 28.5 28 22.5 28 15 V7 Z"
        fill="url(#grad)" stroke="#1e3a5f" stroke-width="1"/>
  <!-- stethoscope tubing -->
  <path d="M12 10 V16 Q12 20 16 20 Q20 20 20 16 V10"
        stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- earpieces -->
  <circle cx="12" cy="9" r="1.5" fill="#fff"/>
  <circle cx="20" cy="9" r="1.5" fill="#fff"/>
  <!-- chest piece -->
  <circle cx="16" cy="22" r="2.5" fill="#fff" stroke="#1e3a5f" stroke-width="0.8"/>
  <circle cx="16" cy="22" r="1" fill="#34d399"/>
  <!-- check mark -->
  <path d="M10.5 15 L14 18.5 L21.5 11" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>
