# Minimal nginx config for serving the Post-Visit Summary SPA.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # gzip text-like responses; modern bundlers produce many small JS chunks.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types
    text/plain text/css application/json application/javascript
    application/xml text/xml image/svg+xml font/ttf font/otf font/woff font/woff2;

  server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed Vite assets.
    location /assets/ {
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Never cache the HTML shell so new deploys show up.
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: any unknown path rewrites to /index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Simple readiness probe for Container Apps.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
