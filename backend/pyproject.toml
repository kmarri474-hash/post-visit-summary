[project]
name = "post-visit-summary"
version = "0.1.0"
description = "Post-Visit Summary & Clinical Coding Multi-Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "sse-starlette>=2.1.0",
  "langgraph>=0.2.35",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "openai>=1.50.0",
  "tenacity>=8.3.0",
  "jinja2>=3.1.4",
  "python-json-logger>=2.0.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7", "ruff>=0.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
